<section class="action">
  <div class="container action-inner">
    <div class="badge reveal">Promo Terbatas</div>
    <h2 class="reveal">Ambil Penawaran Spesial Hari Ini</h2>
    <p class="sub reveal">Harga normalnya tinggi, tapi sekarang kamu bisa mulai dengan harga yang jauh lebih hemat.</p>

    <div class="price-card reveal">
      <div class="price-row">
        <span class="price-old">Rp 499.000</span>
        <span class="price-now">Rp 98.000</span>
      </div>
      <div class="price-note">Harga promo bisa berubah sewaktu-waktu</div>
      <button class="cta">Saya Mau Ikut Sekarang</button>
    </div>
  </div>
</section>

<style>
  :root{
    --ink:#2e2a25;
    --ink-soft:#5a534a;
    --gold:#f3d27a;
    --gold-deep:#d3a24a;
    --paper:#fffaf0;
    --shadow:0 20px 50px rgba(92, 63, 24, 0.2);
    --wrap:980px;
  }

  .action{
    padding:70px 0 80px;
    background:#ffffff;
    text-align:center;
    position:relative;
    overflow:hidden;
    color:var(--ink);
  }
  .action::before{
    content:"";
    position:absolute;
    inset:12% 0 auto 0;
    margin:0 auto;
    width:360px;
    height:360px;
    background:radial-gradient(circle, rgba(243,210,122,0.3), rgba(243,210,122,0));
    filter:blur(6px);
    opacity:0.7;
  }

  .action-inner{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }

  .action .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:6px 12px;
    border-radius:999px;
    background:rgba(243, 210, 122, 0.35);
    color:#7a541d;
    font-weight:700;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
  }

  .action h2{
    margin:0;
    font-family:"Playfair Display", serif;
    font-size:clamp(26px, 4.2vw, 40px);
    line-height:1.2;
  }

  .action .sub{
    margin:0;
    color:var(--ink-soft);
    font-size:14px;
  }

  .price-card{
    margin-top:10px;
    background:var(--paper);
    border:1px solid rgba(179, 120, 34, 0.2);
    border-radius:18px;
    padding:18px 20px;
    box-shadow:var(--shadow);
    min-width:min(92vw, 420px);
  }

  .price-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
  }

  .price-old{
    position:relative;
    font-size:20px;
    color:#9a7a55;
  }
  .price-old::after{
    content:"";
    position:absolute;
    left:-4px;
    right:-4px;
    top:50%;
    height:3px;
    background:#c83a2a;
    transform:rotate(-6deg);
  }

  .price-now{
    font-size:32px;
    font-weight:800;
    color:#2e2a25;
  }

  .price-note{
    margin-top:6px;
    font-size:12px;
    color:#7a6a58;
  }

  .cta{
    margin-top:12px;
    border:none;
    padding:12px 20px;
    border-radius:999px;
    background:linear-gradient(120deg, #f3d27a 0%, #d3a24a 100%);
    color:#3b260a;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.04em;
    cursor:pointer;
    box-shadow:0 14px 28px rgba(138, 91, 22, 0.25);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .cta:hover{
    transform:translateY(-2px);
    box-shadow:0 18px 36px rgba(138, 91, 22, 0.3);
  }

  .action .reveal{
    opacity:0;
    transform:translateY(18px);
    transition:opacity .8s ease, transform .8s ease;
  }
  .action .reveal.is-visible{ opacity:1; transform:translateY(0); }

  @media (max-width: 720px){
    .action{ padding:60px 0 70px; }
  }
</style>

<script>
  const actionObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        actionObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.18 });

  document.querySelectorAll('.action .reveal').forEach((el) => actionObserver.observe(el));
</script>
