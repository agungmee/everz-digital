<style>
  #purchase-popups {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 9999;
    display: grid;
    gap: 10px;
    pointer-events: none;
    font-family: "Fraunces", "Unbounded", "Plus Jakarta Sans", serif;
  }

  .purchase-toast {
    background: rgba(30, 26, 23, 0.82);
    color: #fff;
    padding: 12px 14px;
    border-radius: 14px;
    box-shadow: 0 18px 36px rgba(30, 26, 23, 0.25);
    width: min(320px, 90vw);
    display: grid;
    gap: 6px;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }

  .purchase-toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  .purchase-title {
    font-weight: 700;
    font-size: 0.98rem;
    line-height: 1.3;
  }

  .purchase-time {
    color: #f5e9df;
    font-size: 0.85rem;
  }
</style>

<div id="purchase-popups" aria-live="polite" aria-atomic="true"></div>

<script>
  (function () {
    const names = [
      "Doni Laksana",
      "Rina Putri",
      "Bima Ardi",
      "Salsa Mulyani",
      "Agus Pratama",
      "Nadia Wati",
      "Fajar Rizki",
      "Siti Aulia",
      "Reza Mahendra",
      "Ayu Prameswari",
    ];

    const product = "Rental Mobil Mastery";
    const totalItems = 10;
    const popups = [];

    const makeRandomTimeLabel = () => {
      return Math.random() > 0.5 ? "Hari ini" : "Kemarin";
    };

    const shuffle = (arr) => {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    };

    const list = shuffle(names).slice(0, totalItems).map((name) => ({
      name,
      time: makeRandomTimeLabel(),
    }));

    const container = document.getElementById("purchase-popups");
    if (!container) return;

    const showToast = (item) => {
      const toast = document.createElement("div");
      toast.className = "purchase-toast";
      toast.innerHTML = `
        <div class="purchase-title">${item.name} telah membeli ${product}</div>
        <div class="purchase-time">${item.time}</div>
      `;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add("show"));

      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 350);
      }, 3500);
    };

    let index = 0;
    setInterval(() => {
      showToast(list[index]);
      index = (index + 1) % list.length;
    }, 7000);
  })();
</script>
