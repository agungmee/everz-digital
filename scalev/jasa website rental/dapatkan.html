<section id="dapatkan" class="section">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&display=swap");

    #dapatkan {
      padding: 90px 0;
      background: linear-gradient(180deg, #ffffff 0%, #f6fdfb 100%);
    }

    #dapatkan .wrap {
      width: min(1080px, 92vw);
      margin: 0 auto;
      display: grid;
      gap: 22px;
    }

    #dapatkan h2 {
      font-family: "Unbounded", sans-serif;
      font-size: clamp(1.8rem, 2.2vw + 0.9rem, 2.6rem);
      margin: 0;
      color: #121323;
      text-align: center;
    }

    #dapatkan .lead {
      font-family: "Manrope", sans-serif;
      color: #3f445b;
      max-width: 720px;
      line-height: 1.7;
      text-align: center;
      margin: 0 auto;
    }

    #dapatkan .checklist {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }

    #dapatkan .checklist li {
      background: #fff;
      border-radius: 16px;
      padding: 16px 18px;
      border: 1px solid rgba(16, 24, 40, 0.08);
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.06);
      display: grid;
      grid-template-columns: 26px 1fr;
      gap: 10px;
      align-items: start;
      font-family: "Manrope", sans-serif;
      color: #3f445b;
      line-height: 1.6;
    }

    #dapatkan .icon {
      font-size: 1.1rem;
      line-height: 1.2;
      color: #0b7a6b;
    }

    @media (max-width: 720px) {
      #dapatkan {
        padding: 70px 0;
      }
    }
  </style>

  <div class="wrap">
    <div>
      <h2>Yang Anda Dapatkan</h2>
      <p class="lead">Checklist jelas supaya tidak ada asumsi di tengah jalan.</p>
    </div>

    <ul class="checklist">
      <li><span class="icon">✔</span><span>Website rental mobil (1 halaman)</span></li>
      <li><span class="icon">✔</span><span>Desain profesional &amp; responsif</span></li>
      <li><span class="icon">✔</span><span>Daftar mobil + tombol WhatsApp</span></li>
      <li><span class="icon">✔</span><span>Syarat &amp; ketentuan</span></li>
      <li><span class="icon">✔</span><span>Domain <strong>.my.id</strong></span></li>
      <li><span class="icon">✔</span><span>Setup &amp; publish website</span></li>
    </ul>
  </div>
</section>
