<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Popup Pembelian - Sales Internet Kabel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#1f2430;
      --ink-soft:#5d6678;
      --accent:#1a2ad6;
      --bg:#f6f7fb;
      --card:#ffffff;
      --shadow:0 18px 40px rgba(24, 38, 80, 0.14);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      font-family:"Sora", system-ui, sans-serif;
      background:linear-gradient(120deg, #f6f7fb 0%, #eef1ff 100%);
      color:var(--ink);
      display:grid;
      place-items:center;
    }
    .popup{
      width:min(92vw, 420px);
      background:var(--card);
      border-radius:16px;
      box-shadow:var(--shadow);
      border:1px solid rgba(26,42,214,0.08);
      padding:16px 16px 14px;
      display:flex;
      gap:12px;
      align-items:flex-start;
      position:relative;
      overflow:hidden;
      animation:slideIn .45s ease;
    }
    .badge{
      width:44px;
      height:44px;
      border-radius:12px;
      display:grid;
      place-items:center;
      background:rgba(26,42,214,0.12);
      color:var(--accent);
      font-weight:700;
      flex:0 0 auto;
    }
    .title{
      font-weight:700;
      font-size:15px;
      line-height:1.3;
    }
    .time{
      margin-top:6px;
      font-size:12px;
      color:var(--ink-soft);
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      margin-top:8px;
      font-size:11px;
      padding:4px 8px;
      border-radius:999px;
      background:rgba(26,42,214,0.08);
      color:#2b3fe6;
      font-weight:600;
    }
    .dot{
      width:6px;
      height:6px;
      border-radius:50%;
      background:#24c16c;
      display:inline-block;
    }
    @keyframes slideIn{
      from{ transform:translateY(16px); opacity:0; }
      to{ transform:translateY(0); opacity:1; }
    }
  </style>
</head>
<body>
  <div class="popup" role="status" aria-live="polite">
    <div class="badge">SI</div>
    <div>
      <div class="title">Deri sudah membeli Sales Internet Kabel Starter Ads</div>
      <div class="pill"><span class="dot"></span>Baru saja</div>
      <div class="time" id="timeText">11 menit yang lalu</div>
    </div>
  </div>

  <script>
    const timeText = document.getElementById('timeText');
    const minutesAgo = 6 + Math.floor(Math.random() * 18);
    timeText.textContent = minutesAgo + ' menit yang lalu';
  </script>
</body>
</html>
