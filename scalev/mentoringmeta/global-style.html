<style>
  @import url("https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap");

  :root {
    color-scheme: light;
    --blue: #0b4bff;
    --green: #0fb06a;
    --green-soft: #d7f7e8;
    --dark: #1e1a17;
    --cream: #f6fffb;
    --cream-2: #e2f5ec;
    --muted: #4f433c;
    --light: #f5e9df;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
    color: var(--muted);
    background: radial-gradient(circle at top, #eafff4 0%, var(--cream) 55%, var(--cream-2) 100%);
  }

  img {
    max-width: 100%;
    display: block;
  }

  a {
    color: inherit;
  }

  .page {
    display: grid;
    gap: 0;
  }

  .topbar {
    width: min(980px, 92vw);
    margin: 28px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 18px;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 18px 36px rgba(30, 26, 23, 0.18);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-mark {
    width: 40px;
    height: 40px;
    border-radius: 14px;
    background: linear-gradient(120deg, #16c46d, #0e9c60);
    display: grid;
    place-items: center;
    color: #fff;
    font-weight: 800;
    font-family: "Fraunces", serif;
  }

  .brand-title {
    font-family: "Fraunces", serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--dark);
  }

  .badge {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #0e7d57;
    background: var(--green-soft);
    padding: 7px 12px;
    border-radius: 999px;
    font-weight: 700;
  }

  .section {
    padding: 90px 0;
    text-align: center;
    background: radial-gradient(circle at top, #eafff4 0%, var(--cream) 55%, var(--cream-2) 100%);
  }

  .wrap {
    width: min(980px, 92vw);
    margin: 0 auto;
    display: grid;
    gap: 20px;
    justify-items: center;
  }

  h1,
  h2 {
    font-family: "Fraunces", serif;
    color: var(--blue);
    letter-spacing: -0.02em;
    margin: 0;
  }

  h1 {
    font-size: clamp(2.4rem, 3.6vw + 0.8rem, 3.6rem);
    line-height: 1.05;
    text-shadow: 0 10px 32px rgba(11, 75, 255, 0.2);
  }

  h2 {
    font-size: clamp(2.1rem, 3.1vw + 0.8rem, 3.1rem);
    line-height: 1.1;
  }

  h3 {
    margin: 0;
    font-size: 1.2rem;
    color: #ffffff;
  }

  .headline-2 {
    font-family: "Fraunces", serif;
    font-size: clamp(1.7rem, 2.2vw + 0.8rem, 2.5rem);
    font-weight: 800;
    line-height: 1.1;
    color: var(--blue);
    margin: 0;
    padding: 10px 18px;
    background: var(--green-soft);
    border-radius: 16px;
    box-shadow: 0 16px 34px rgba(15, 176, 106, 0.25);
  }

  .lead {
    max-width: 720px;
    font-size: 1.08rem;
    line-height: 1.7;
    margin: 0;
  }

  .cta-row {
    display: grid;
    gap: 10px;
    justify-items: center;
  }

  .cta-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 16px 34px;
    border-radius: 999px;
    font-weight: 800;
    text-decoration: none;
    background: var(--green);
    color: #fff;
    box-shadow: 0 16px 36px rgba(15, 176, 106, 0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .cta-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 34px rgba(15, 176, 106, 0.4);
  }

  .microcopy {
    font-size: 0.9rem;
    color: #5c4f46;
  }

  .trust-list,
  .list {
    list-style: none;
    margin: 0;
    padding: 20px 22px;
    display: grid;
    gap: 12px;
    background: var(--dark);
    border-radius: 18px;
    box-shadow: 0 20px 40px rgba(30, 26, 23, 0.25);
    width: min(820px, 92vw);
    text-align: left;
    color: var(--light);
  }

  .trust-list li,
  .list li {
    display: grid;
    grid-template-columns: 24px 1fr;
    gap: 10px;
    align-items: start;
    font-size: 1.02rem;
  }

  .section-note {
    font-size: 0.95rem;
    color: #5c4f46;
    max-width: 720px;
  }

  .steps,
  .pricing,
  .filter-grid,
  .gallery,
  .faq {
    display: grid;
    gap: 16px;
    width: min(920px, 92vw);
  }

  .step-card,
  .price-card,
  details,
  .timeline {
    background: var(--dark);
    color: var(--light);
    border-radius: 18px;
    padding: 18px 20px;
    box-shadow: 0 20px 40px rgba(30, 26, 23, 0.25);
    text-align: left;
  }

  .step-card strong {
    color: #ffffff;
  }

  .deliverable-grid {
    display: grid;
    gap: 16px;
    width: min(920px, 92vw);
  }

  .timeline strong {
    color: #ffffff;
    display: block;
    margin-bottom: 6px;
  }

  .gallery {
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  }

  .shot {
    height: 160px;
    border-radius: 18px;
    border: 1px dashed rgba(255, 255, 255, 0.35);
    background: linear-gradient(135deg, rgba(15, 176, 106, 0.22), rgba(11, 75, 255, 0.18));
    display: grid;
    place-items: center;
    color: #ffffff;
    font-weight: 700;
  }

  .price-card {
    position: relative;
    display: grid;
    gap: 12px;
  }

  .price-card.highlight {
    border: 2px solid var(--green);
  }

  .price-badge {
    position: absolute;
    top: 16px;
    right: 16px;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(15, 176, 106, 0.2);
    color: #ffffff;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .price-tag {
    font-size: 2.2rem;
    font-weight: 700;
    color: #ffffff;
  }

  .price-card p {
    margin: 0;
    color: var(--light);
  }

  details summary {
    font-weight: 700;
    cursor: pointer;
    color: #ffffff;
  }

  details p {
    margin: 10px 0 0;
  }

  @media (min-width: 760px) {
    .hero-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      align-items: center;
      width: min(980px, 92vw);
    }

    .pricing {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .filter-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .deliverable-grid {
      grid-template-columns: 1.2fr 0.8fr;
    }
  }

  @media (max-width: 700px) {
    .section {
      padding: 70px 0;
    }

    .topbar {
      margin-top: 20px;
    }
  }
</style>
