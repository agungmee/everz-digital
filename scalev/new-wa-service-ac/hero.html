<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WA Service AC | Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#1f2430;
      --ink-soft:#4d5668;
      --blue:#3349ff;
      --blue-dark:#1a2ad6;
      --cyan:#19d7ff;
      --lime:#b7ff1c;
      --paper:#ffffff;
      --shadow:0 24px 60px rgba(24, 38, 80, 0.18);
      --radius:22px;
      --wrap:980px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:"Sora", system-ui, sans-serif;
      color:var(--ink);
      background:#ffffff;
      min-height:100vh;
    }
    img{ max-width:100%; display:block; }

    .container{
      width:min(92vw, var(--wrap));
      margin:0 auto;
    }

    .hero{
      padding:80px 0 90px;
      position:relative;
      overflow:hidden;
      text-align:center;
      padding-left:10px;
      padding-right:10px;
    }
    .hero::after{
      content:none;
    }

    .hero-inner{
      position:relative;
      z-index:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
    }

    .kicker{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(51,73,255,0.1);
      color:var(--blue-dark);
      font-weight:600;
      font-size:12px;
      letter-spacing:0.08em;
      text-transform:uppercase;
    }

    h1{
      margin:0;
      font-family:"Playfair Display", serif;
      font-size:clamp(32px, 5vw, 52px);
      line-height:1.06;
    }

    .headline-strong{ color:var(--blue-dark); }

    .lead{
      margin:0;
      color:var(--ink-soft);
      font-size:clamp(15px, 2vw, 18px);
      line-height:1.7;
      max-width:700px;
    }

    .highlight{
      display:inline-block;
      padding:6px 10px;
      background:linear-gradient(120deg, rgba(183,255,28,0.65), rgba(25,215,255,0.35));
      border-radius:10px;
      font-weight:600;
      color:#1a2a00;
    }

    .hero-proof{
      width:min(92vw, 520px);
      border-radius:18px;
      border:1px solid rgba(51,73,255,0.12);
      box-shadow:var(--shadow);
    }

    .cta-bottom{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      margin-top:6px;
      padding:12px 22px;
      border-radius:999px;
      background:#18b566;
      color:#ffffff;
      font-weight:700;
      border:none;
      cursor:pointer;
      text-decoration:none;
      box-shadow:0 14px 28px rgba(24, 120, 70, 0.22);
      transition:transform .2s ease, box-shadow .2s ease;
    }
    .cta-bottom:hover{
      transform:translateY(-2px);
      box-shadow:0 18px 36px rgba(24, 120, 70, 0.28);
    }

    .poster{
      margin-top:14px;
      background:var(--paper);
      border-radius:var(--radius);
      padding:26px 26px 22px;
      box-shadow:var(--shadow);
      border:1px solid rgba(51,73,255,0.08);
      position:relative;
      overflow:hidden;
      width:min(92vw, 520px);
      text-align:center;
    }
    .poster::before{
      content:"";
      position:absolute;
      inset:-40% 50% auto auto;
      width:220px;
      height:220px;
      background:radial-gradient(circle, rgba(183,255,28,0.5), rgba(183,255,28,0));
      opacity:0.8;
    }

    .poster h2{
      margin:0 0 10px;
      font-size:20px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:0.04em;
    }
    .poster-title{
      font-size:26px;
      font-weight:800;
      color:var(--blue-dark);
      margin:0 0 12px;
    }
    .poster p{
      margin:0 0 14px;
      color:var(--ink-soft);
      font-size:14px;
      line-height:1.6;
    }

    .poster-highlight{
      background:linear-gradient(180deg, #fff6b6 0%, #ffe88a 100%);
      border-radius:14px;
      padding:10px 12px;
      margin:10px 0 12px;
      box-shadow:0 10px 24px rgba(255, 223, 87, 0.35);
    }
    .poster-highlight h2{
      margin:0 0 6px;
      font-size:12px;
      font-weight:700;
      letter-spacing:0.08em;
      text-transform:uppercase;
      color:#3a3200;
    }
    .poster-highlight .poster-title{
      margin:0 0 6px;
      font-size:16px;
      font-weight:700;
      color:var(--blue-dark);
    }
    .poster-highlight p{
      margin:0;
      font-size:12px;
      color:#3a3200;
    }

    .bar{
      background:var(--lime);
      padding:10px 12px;
      font-weight:700;
      font-size:13px;
      border-radius:10px;
      margin:12px 0;
      color:#1f2500;
      text-align:center;
    }

    .badge{
      display:inline-block;
      background:rgba(51,73,255,0.1);
      color:var(--blue-dark);
      padding:6px 10px;
      font-size:12px;
      border-radius:999px;
      font-weight:600;
      margin-bottom:10px;
    }

    .list{
      background:linear-gradient(180deg, #f5ffe4 0%, #eef7d5 100%);
      border-radius:16px;
      padding:16px;
      text-align:left;
    }
    .list-title{
      font-size:14px;
      font-weight:700;
      margin:0 0 12px;
      color:#2a2f12;
    }
    .list-item{
      display:flex;
      align-items:flex-start;
      gap:10px;
      font-size:13px;
      color:#2a2f12;
      margin:0 0 10px;
    }
    .list-item:last-child{ margin-bottom:0; }
    .dot{
      width:18px;
      height:18px;
      border-radius:50%;
      background:#13c56a;
      display:grid;
      place-items:center;
      color:white;
      font-size:12px;
      flex:0 0 auto;
    }
    .list-banner{
      margin-top:14px;
      background:linear-gradient(120deg, rgba(51,73,255,0.12), rgba(25,215,255,0.2));
      border:1px solid rgba(51,73,255,0.18);
      color:#1a2ad6;
      font-weight:700;
      font-size:13px;
      text-align:center;
      padding:10px 12px;
      border-radius:12px;
      text-transform:uppercase;
      letter-spacing:0.04em;
    }

    .reveal{
      opacity:0;
      transform:translateY(22px);
      transition:opacity .8s ease, transform .8s ease;
    }
    .reveal.is-visible{
      opacity:1;
      transform:translateY(0);
    }

    @media (max-width: 720px){
      .hero{ padding:64px 0 70px; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="container hero-inner">
      <div class="kicker reveal">WA Khusus Jasa Service AC</div>
      <h1 class="reveal">Cara Bikin Usaha Service AC <span class="headline-strong">Dibanjiri Chat WhatsApp</span> Dari Calon Pelanggan Setiap Hari</h1>
      <p class="lead reveal">
        Sistem marketing yang sudah dipakai oleh teknisi AC rumahan sampai usaha service AC profesional
        <span class="highlight">tanpa perlu jago iklan atau marketing</span>.
      </p>

      <img class="hero-proof reveal" src="https://everz-digital.site/wp-content/uploads/2026/02/task_01kgxqa8wjfd0ady4wr9hnzdbc_1770524082_img_1.webp" alt="Bukti testimoni pelanggan service AC">

      <button class="cta-bottom reveal" type="button" onclick="window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });">
        Saya Mau Dapat Chat WhatsApp Juga
      </button>

    </div>
  </section>

  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.18 });

    document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));
  </script>
</body>
</html>
