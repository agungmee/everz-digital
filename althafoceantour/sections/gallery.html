<section id="gallery" class="section-padding" style="background-color: var(--bg-light);">
    <div class="container text-center">
        <h2 class="section-title">Gallery Moment</h2>
        <p style="color: var(--text-muted); margin: -1.5rem auto 3rem; max-width: 600px;">
            Abadikan momen tak terlupakan Anda di Labuan Bajo bersama Althaf Ocean Tour.
        </p>
        
        <div class="gallery-slider swiper" style="margin-top: 4rem; padding-bottom: 3.5rem;">
            <div class="swiper-wrapper">
                <div class="swiper-slide">
                    <div class="gallery-item" style="border-radius: var(--radius); overflow: hidden; aspect-ratio: 1/1; cursor: pointer;">
                        <img src="images/labuan_bajo_landscape.png" alt="Labuan Bajo" style="width:100%; height:100%; object-fit:cover; transition: var(--transition);">
                    </div>
                </div>
                <div class="swiper-slide">
                    <div class="gallery-item" style="border-radius: var(--radius); overflow: hidden; aspect-ratio: 1/1; cursor: pointer;">
                        <img src="images/pink_beach.png" alt="Pink Beach" style="width:100%; height:100%; object-fit:cover; transition: var(--transition);">
                    </div>
                </div>
                <div class="swiper-slide">
                    <div class="gallery-item" style="border-radius: var(--radius); overflow: hidden; aspect-ratio: 1/1; cursor: pointer;">
                        <img src="images/pulau_padar.png" alt="Pulau Padar" style="width:100%; height:100%; object-fit:cover; transition: var(--transition);">
                    </div>
                </div>
                <div class="swiper-slide">
                    <div class="gallery-item" style="border-radius: var(--radius); overflow: hidden; aspect-ratio: 1/1; cursor: pointer;">
                        <img src="images/komodo.png" alt="Komodo Dragon" style="width:100%; height:100%; object-fit:cover; transition: var(--transition);">
                    </div>
                </div>
                <div class="swiper-slide">
                    <div class="gallery-item" style="border-radius: var(--radius); overflow: hidden; aspect-ratio: 1/1; cursor: pointer;">
                        <img src="images/phinisi.png" alt="Phinisi Boat" style="width:100%; height:100%; object-fit:cover; transition: var(--transition);">
                    </div>
                </div>
                <div class="swiper-slide">
                    <div class="gallery-item" style="border-radius: var(--radius); overflow: hidden; aspect-ratio: 1/1; cursor: pointer;">
                        <img src="images/jetski_tours.png" alt="Jetski Tour" style="width:100%; height:100%; object-fit:cover; transition: var(--transition);">
                    </div>
                </div>
                <div class="swiper-slide">
                    <div class="gallery-item" style="border-radius: var(--radius); overflow: hidden; aspect-ratio: 1/1; cursor: pointer;">
                        <img src="images/snorkeling.png" alt="Snorkeling Komodo" style="width:100%; height:100%; object-fit:cover; transition: var(--transition);">
                    </div>
                </div>
                <div class="swiper-slide">
                    <div class="gallery-item" style="border-radius: var(--radius); overflow: hidden; aspect-ratio: 1/1; cursor: pointer;">
                        <img src="images/turtle.png" alt="Sea Turtle" style="width:100%; height:100%; object-fit:cover; transition: var(--transition);">
                    </div>
                </div>
            </div>
            
            <!-- Navigation -->
            <div class="swiper-button-next custom-nav" style="right: -10px;"></div>
            <div class="swiper-button-prev custom-nav" style="left: -10px;"></div>
            <div class="swiper-pagination custom-dots"></div>
        </div>
    </div>
</section>

<style>
.gallery-item:hover img {
    transform: scale(1.1);
}
</style>
