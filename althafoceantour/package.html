<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Paket - Althaf Ocean Tour</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar / Header Base -->
    <header class="draft-header">
        <a href="index.html" class="draft-logo">
            <img src="images/logo.png" alt="Althaf Ocean Tour" style="height: 60px; width: auto;">
        </a>
        <nav id="main-nav">
            <a href="index.html" style="color:white; text-decoration:none; font-weight:500; font-family:var(--font-body); font-size:0.9rem; text-transform:uppercase; letter-spacing:1px;">Beranda</a>
            <a href="index.html#destinations" style="color:white; text-decoration:none; font-weight:500; font-family:var(--font-body); font-size:0.9rem; text-transform:uppercase; letter-spacing:1px;">Destinasi</a>
            <a href="index.html#paket-wisata" style="color:white; text-decoration:none; font-weight:500; font-family:var(--font-body); font-size:0.9rem; text-transform:uppercase; letter-spacing:1px;">Paket</a>
            <a href="index.html#testimonials" style="color:white; text-decoration:none; font-weight:500; font-family:var(--font-body); font-size:0.9rem; text-transform:uppercase; letter-spacing:1px;">Testimoni</a>
            <a href="https://wa.me/6287718031430?text=Halo%20Althaf%20Ocean%20Tour,%20saya%20ingin%20konsultasi%20paket%20wisata" class="btn btn-accent">Pesan Sekarang</a>
        </nav>
        <button id="menu-toggle" class="burger-menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <main id="package-detail-container" style="padding-top: 100px;">
        <!-- CONTENT INJECTED BY JS -->
        <div class="container text-center" style="padding: 100px 0;">
            <p>Memuat detail paket...</p>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <!-- WhatsApp Pulse Widget -->
    <div class="wa-widget-container">
        <div id="wa-chat-box" class="wa-chat-box">
            <div class="wa-chat-header">
                <div class="wa-chat-avatar">
                    <img src="images/logo.png" alt="Althaf Ocean Tour">
                </div>
                <div class="wa-chat-info">
                    <span class="wa-chat-name">Althaf Ocean Tour</span>
                    <span class="wa-chat-status">Aktif</span>
                </div>
                <button id="wa-close-chat" class="wa-close-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="wa-chat-body">
                <p>Halo! Ada yang bisa kami bantu untuk rencana liburan Anda?</p>
            </div>
            <div class="wa-chat-footer">
                <textarea id="wa-message-input" placeholder="Ketik pesan Anda..."></textarea>
                <button id="wa-send-btn" class="wa-send-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
        <!-- Pulse Button -->
        <button id="wa-toggle-btn" class="wa-pulse-btn">
            <div class="pulse"></div>
            <i class="fab fa-whatsapp" style="font-size: 32px; color: white;"></i>
        </button>
    </div>

    <!-- SCRIPTS -->
    <script src="js/package-data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/package-detail.js"></script>
    <script>
        // Load Footer
        fetch('sections/footer.html')
            .then(res => res.text())
            .then(html => document.getElementById('footer-placeholder').innerHTML = html);
    </script>
</body>
</html>
