<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Lacensport | Links</title>
  <meta name="description" content="Official links Lacensport." />
  <meta name="theme-color" content="#eef1f4" />

  <!-- OG -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Lacensport®" />
  <meta property="og:description" content="Official links Lacensport." />
  <meta property="og:image" content="https://everz-digital.site/wp-content/uploads/2025/12/2-removebg-preview.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Brand icons -->
  <link rel="preconnect" href="https://cdn.simpleicons.org" />
  <link rel="dns-prefetch" href="https://cdn.simpleicons.org" />

  <style>
    :root{
      --bg:#eef1f4;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --stroke: rgba(17,24,39,.08);
      --shadow: 0 10px 22px rgba(17,24,39,.10);
      --radius: 12px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: var(--bg);
      color: var(--text);
    }

    .wrap{
      min-height:100%;
      display:flex;
      justify-content:center;
      padding: 34px 16px 44px;
    }

    .container{
      width: min(420px, 100%);
    }

    /* header */
    .top{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 12px;
      margin: 6px 0 18px;
    }

    .mark{
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--stroke);
      box-shadow: 0 10px 20px rgba(17,24,39,.08);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .mark img{
      width: 72%;
      height: 72%;
      object-fit:contain;
      display:block;
    }

    .brand{
      font-weight: 700;
      font-size: 20px;
      letter-spacing: .2px;
    }

    /* buttons */
    .list{
      display:flex;
      flex-direction:column;
      gap: 12px;
      margin-top: 8px;
    }

    .btn{
      display:flex;
      align-items:center;
      gap: 12px;

      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 14px;

      color: inherit;
      text-decoration:none;

      transition: transform .12s ease, box-shadow .12s ease;
    }
    .btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(17,24,39,.14);
    }
    .btn:active{ transform: translateY(0); }

    .left{
      display:flex;
      align-items:center;
      gap: 12px;
      min-width:0;
      flex: 1 1 auto;
    }

    /* Icon fixed + clean */
    .ico{
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid rgba(17,24,39,.10);
      background: #fff;
      display:flex;
      align-items:center;
      justify-content:center;
      flex: 0 0 auto;
      overflow:hidden;
    }
    .ico svg, .ico img{
      width: 20px;
      height: 20px;
      display:block;
    }
    .ico.top3 img{
      width: 25px;
      height: 25px;
    }

    /* TEXT: rata kiri */
    .txt{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      justify-content:center;
      gap: 2px;
      min-width:0;
      flex: 1 1 auto;
      text-align:left;
    }
    .title{
      font-weight: 600;
      font-size: 14px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin:0;
    }
    .sub{
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.25;
      white-space: normal;
      margin:0;
    }

    .foot{
      margin-top: 18px;
      text-align:center;
      font-size: 12px;
      color: rgba(17,24,39,.45);
    }

    .btn:focus-visible{
      outline: 3px solid rgba(59,130,246,.28);
      outline-offset: 3px;
    }

    @media (max-width: 480px){
      .container{
        width: 100%;
      }
      .btn{
        padding: 12px 11px;
      }
      .left{
        gap: 10px;
      }
      .title{
        font-size: 13.5px;
        line-height: 1.2;
      }
      .sub{
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="container">

      <header class="top">
        <div class="mark" aria-hidden="true">
          <img src="https://everz-digital.site/wp-content/uploads/2025/12/2-removebg-preview.png" alt="Lacensport Logo" />
        </div>
        <div class="brand">Lacensport®</div>
      </header>

      <section class="list" aria-label="Links">

        <!-- 1) Best Seller Regular -->
        <a class="btn" href="https://id.shp.ee/KHtp2jFY" target="_blank" rel="noopener noreferrer">
          <div class="left">
            <div class="ico top3" aria-hidden="true">
              <img src="https://everz-digital.site/wp-content/uploads/2026/03/best-seller-regular-2.png" alt="" />
            </div>
            <div class="txt">
              <p class="title">Best Seller - Regular Size (S-XL)</p>
            </div>
          </div>
        </a>

        <!-- 2) Best Seller Plus Size -->
        <a class="btn" href="https://id.shp.ee/XXRUXdMc" target="_blank" rel="noopener noreferrer">
          <div class="left">

              <img src="https://everz-digital.site/wp-content/uploads/2026/03/best-seller-plus-size-1.png" alt="" />
            </div>
            <div class="txt">
              <p class="title">Best Seller - Plus Size (Up to 8XL)</p>
            </div>
          </div>
        </a>

        <!-- 3) Plus Size Collection -->
        <a class="btn" href="https://id.shp.ee/urMspsb" target="_blank" rel="noopener noreferrer">
          <div class="left">
            <div class="ico top3" aria-hidden="true">
              <img src="https://everz-digital.site/wp-content/uploads/2026/03/plus-size-collection-1.png" alt="" />
            </div>
            <div class="txt">
              <p class="title">Plus Size Collection (Premium)</p>
            </div>
          </div>
        </a>

        <!-- 4) WhatsApp -->
        <a class="btn" href="https://wa.me/6285974615313?text=Halo%20CS%20Lacensport,%20saya%20mau%20tanya%20size%20dan%20stok."
           target="_blank" rel="noopener noreferrer">
          <div class="left">
            <div class="ico" aria-hidden="true">
              <img src="https://cdn.simpleicons.org/whatsapp/22c55e" alt="" />
            </div>
            <div class="txt">
              <p class="title">Chat Size &amp; Stock</p>
            </div>
          </div>
        </a>

        <!-- 5) Shopee -->
        <a class="btn" href="https://shopee.co.id/lacensport" target="_blank" rel="noopener noreferrer">
          <div class="left">
            <div class="ico" aria-hidden="true">
              <img src="https://cdn.simpleicons.org/shopee/ff6533" alt="" />
            </div>
            <div class="txt">
              <p class="title">Shopee Official Store</p>
            </div>
          </div>
        </a>

        <!-- 6) TikTok -->
        <a class="btn" href="https://www.tiktok.com/@lacensport" target="_blank" rel="noopener noreferrer">
          <div class="left">
            <div class="ico" aria-hidden="true">
              <img src="https://cdn.simpleicons.org/tiktok/111827" alt="" />
            </div>
            <div class="txt">
              <p class="title">Tiktok Shop Mall</p>
            </div>
          </div>
        </a>

      </section>

      <div class="foot">© <span id="y"></span> Lacensport</div>
    </div>
  </main>

  <script>
    document.getElementById("y").textContent = new Date().getFullYear();
  </script>
</body>
</html>
