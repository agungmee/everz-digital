<style>
  .mc-hero{
    position:relative;
    min-height:calc(100vh - 84px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:64px 20px;
    overflow:hidden;
    background:#050505;
  }

  .mc-hero-slider{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }

  .mc-hero-slide{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background-size:cover;
    background-position:center;
    opacity:0;
    transition:opacity 0.8s ease-in-out;
  }

  .mc-hero-slide.active{
    opacity:1;
  }

  .mc-hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(5,5,5,0.85) 0%, rgba(5,5,5,0.98) 100%);
    filter:brightness(0.15);
    z-index:0;
  }

  .mc-hero-bg{
    display:none;
  }

  .mc-hero-indicators{
    position:absolute;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    z-index:2;
    display:flex;
    gap:8px;
    align-items:center;
  }

  .mc-hero-indicator{
    width:10px;
    height:10px;
    border-radius:50%;
    background:rgba(255,255,255,0.4);
    cursor:pointer;
    transition:all 0.3s ease;
    border:none;
    padding:0;
  }

  .mc-hero-indicator.active{
    background:#dc2626;
    width:28px;

  }

  .mc-hero-indicator:hover{

  .mc-hero-content{

  .mc-hero-subhead{

  .mc-hero-actions{

  }

  .mc-hero-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    padding:13px 22px;
    border-radius:0;
    text-decoration:none;
    font-size:22px;
    font-weight:800;
    letter-spacing:.02em;
    text-transform:uppercase;
    transition:transform .2s ease, opacity .2s ease;
  }

  .mc-hero-btn:hover{
    transform:translateY(-1px);
    opacity:.95;
  }

  .mc-hero-btn.primary{
    background:#dc2626;

  }

  .mc-hero-btn.secondary{

  }

  .mc-hero-meta{
    margin:16px auto 0;
    display:grid;
    gap:6px;
    justify-items:center;
  }

  .mc-hero-meta p{
    margin:0;
    color:#f3f3f3;
    font-size:clamp(16px, 2vw, 22px);
    line-height:1.2;

    letter-spacing:.02em;
  }

  }

  @media (max-width: 900px){

<script>
(function() {
  const slides = document.querySelectorAll('.mc-hero-slide');
  const indicators = document.querySelectorAll('.mc-hero-indicator');
  let currentSlide = 0;
  const slideInterval = 5000; // 5 detik per slide
  let autoPlayTimer;

  function showSlide(index) {
    slides.forEach(slide => slide.classList.remove('active'));
    indicators.forEach(indicator => indicator.classList.remove('active'));
    
    slides[index].classList.add('active');
    indicators[index].classList.add('active');
    currentSlide = index;
  }

  function nextSlide() {
    showSlide((currentSlide + 1) % slides.length);
  }

  function startAutoPlay() {
    autoPlayTimer = setInterval(nextSlide, slideInterval);
  }

  function resetAutoPlay() {
    clearInterval(autoPlayTimer);
    startAutoPlay();
  }

  // Click handlers untuk indicators
  indicators.forEach(indicator => {
    indicator.addEventListener('click', () => {
      const slideIndex = parseInt(indicator.getAttribute('data-slide'));
      showSlide(slideIndex);
      resetAutoPlay();
    });
  });

  // Pause autoplay on mouse enter, resume on mouse leave
  const heroSection = document.querySelector('.mc-hero');
  heroSection.addEventListener('mouseenter', () => clearInterval(autoPlayTimer));
  heroSection.addEventListener('mouseleave', startAutoPlay);

  // Start autoplay
  startAutoPlay();
})();
</script>
