  }

  .mc-contact-title{

  .mc-contact-title span{

  }

  .mc-contact-list{

  .mc-contact-item{

    padding:10px 12px;

    text-decoration:none;
    word-break:break-word;
  }

  .mc-contact-item a:hover{
    color:#dc2626;
  }

  .mc-map-wrap{
    border:1px solid #2a2a2a;
    background:#0a0a0a;
    min-height:420px;
  }

  .mc-map-wrap iframe{
    width:100%;
    height:100%;
    min-height:420px;
    border:0;
    display:block;
  }

  @media (max-width: 960px){
    .mc-contact{

    .mc-contact-inner{

    }

    .mc-contact-title{
      font-size:clamp(28px, 4.5vw, 56px);
      margin-bottom:16px;
    }

    .mc-contact-item p,
    .mc-contact-item a{

    }

    .mc-contact-item strong{

    }

    .mc-map-wrap,

      min-height:320px;
    }
  }

  @media (max-width: 480px){

    }

    .mc-contact-item{

    .mc-contact-item strong{
      font-size:16px;
    }

    .mc-contact-item p,
    .mc-contact-item a{
