<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">

<style>
  :root{
    --mc-primary:#dc2626;
    --mc-primary-dark:#b91c1c;
    --mc-ink:#050505;
    --mc-soft:#2f2f2f;
    --mc-paper:#ffffff;
    --mc-line:#e7e7e7;
  }

  .mc-nav-wrap{
    width:100%;
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:1000;
    background:#050505;
    backdrop-filter:blur(10px);
    border-bottom:1px solid #222;
  }

  .mc-nav-main{
    max-width:1120px;
    margin:0 auto;
    padding:0 20px;
  }

  .mc-nav-main{
    min-height:84px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:22px;
    font-family:"Barlow Condensed",sans-serif;
  }

  .mc-brand{
    display:flex;
    align-items:center;
    gap:14px;
    text-decoration:none;
    color:#ffffff;
    min-width:0;
  }

  .mc-brand img{
    width:58px;
    height:58px;
    object-fit:contain;
    border-radius:0;
    background:transparent;
    border:0;
    padding:0;
  }

  .mc-brand-text{
    min-width:0;
  }

  .mc-brand-text strong{
    display:block;
    font-size:26px;
    line-height:1.1;
    letter-spacing:.02em;
    font-weight:800;
    text-transform:uppercase;
  }
  .mc-brand-text .metro{ color:#ffffff; }
  .mc-brand-text .autocool{ color:var(--mc-primary); }

  .mc-brand-text small{
    display:block;
    color:#d4d4d4;
    font-size:16px;
    margin-top:2px;
    font-weight:600;
    letter-spacing:.03em;
  }

  .mc-menu{
    display:flex;
    align-items:center;
    gap:20px;
  }

  .mc-menu a{
    text-decoration:none;
    color:#ffffff;
    font-weight:700;
    font-size:18px;
    letter-spacing:.03em;
    text-transform:uppercase;
    transition:color .2s ease;
  }

  .mc-menu a:hover{
    color:var(--mc-primary);
  }

  .mc-cta{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    padding:11px 16px;
    border-radius:0;
    background:var(--mc-primary);
    color:#ffffff;
    font-weight:800;
    font-size:16px;
    letter-spacing:.04em;
    text-transform:uppercase;
    border:1px solid #ef4444;
    gap:8px;
  }

  .mc-mobile-btn{
    display:none;
    width:42px;
    height:42px;
    border-radius:0;
    border:1px solid #2e2e2e;
    background:#101010;
    color:#ffffff;
    cursor:pointer;
    font-size:18px;
  }

  .mc-mobile-panel{
    position:fixed;
    top:0;
    right:0;
    width:min(84vw, 340px);
    height:100vh;
    background:#050505;
    padding:92px 24px 24px;
    font-family:"Barlow Condensed",sans-serif;
    border-left:1px solid #262626;
    box-shadow:-16px 0 36px rgba(0,0,0,0.18);
    transform:translateX(104%);
    opacity:0;
    pointer-events:none;
    transition:transform .32s ease, opacity .28s ease;
    z-index:1300;
    display:flex;
    flex-direction:column;
    box-sizing:border-box;
  }

  .mc-mobile-panel.open{
    transform:translateX(0);
    opacity:1;
    pointer-events:auto;
  }

  .mc-mobile-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
    z-index:1200;
  }

  .mc-mobile-overlay.open{
    opacity:1;
    pointer-events:auto;
  }

  .mc-mobile-panel a{
    display:block;
    padding:10px 0;
    text-decoration:none;
    color:#ffffff;
    font-weight:700;
    font-size:18px;
    text-transform:uppercase;
  }
  .mc-mobile-panel a:hover{ color:var(--mc-primary); }

  .mc-mobile-links{
    display:grid;
    gap:2px;
  }

  .mc-mobile-close{
    position:absolute;
    top:14px;
    right:14px;
    width:40px;
    height:40px;
    border-radius:0;
    border:1px solid #2c2c2c;
    background:#111;
    color:#fff;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    cursor:pointer;
  }

  .mc-mobile-contact{
    margin-top:auto;
    display:inline-flex;
    width:100%;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-decoration:none;
    border-radius:0;
    background:#dc2626;
    color:#fff;
    border:1px solid #ef4444;
    padding:12px 14px;
    font-size:20px;
    font-weight:800;
    letter-spacing:.03em;
    text-transform:uppercase;
  }

  @media (max-width: 900px){
    .mc-menu,
    .mc-cta{ display:none; }

    .mc-mobile-btn{ display:block; }

    .mc-nav-main{
      min-height:72px;
    }

    .mc-brand img{
      width:50px;
      height:50px;
    }

    .mc-brand-text strong{
      font-size:18px;
    }
  }
</style>

<header class="mc-nav-wrap" id="mcNavbar">
  <div class="mc-nav-main">
    <a href="#home" class="mc-brand" aria-label="Metro Autocool">
      <img src="https://everz-digital.site/wp-content/uploads/2026/02/task_01kh89sfy2fwt8ckgeez9sxdpf_1770879018_img_0.webp" alt="Logo Metro Autocool">
      <div class="mc-brand-text">
        <strong><span class="metro">Metro</span> <span class="autocool">Autocool</span></strong>
        <small>acmobilsurabaya.com</small>
      </div>
    </a>

    <nav class="mc-menu" aria-label="Primary Navigation">
      <a href="#home">Home</a>
      <a href="#tentang">Tentang</a>
      <a href="#layanan">Layanan</a>
      <a href="#fasilitas">Fasilitas</a>
      <a href="#testimoni">Testimoni</a>
      <a href="#artikel">Artikel</a>
      <a href="#kontak">Kontak</a>
    </nav>

    <a href="https://wa.me/628525858626 2?text=Halo%20Metro%20Autocool" target="_blank" rel="noopener" class="mc-cta">
      <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
      <span>Hubungi Kami</span>
    </a>

    <button id="mcMobileBtn" class="mc-mobile-btn" type="button" aria-label="Buka menu" aria-expanded="false">
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>
  </div>

  <button id="mcMobileOverlay" class="mc-mobile-overlay" type="button" aria-label="Tutup menu"></button>
  <div id="mcMobilePanel" class="mc-mobile-panel" aria-label="Mobile Navigation">
    <button id="mcMobileClose" class="mc-mobile-close" type="button" aria-label="Tutup menu">
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
    <div class="mc-mobile-links">
      <a href="#home">Home</a>
      <a href="#tentang">Tentang</a>
      <a href="#layanan">Layanan</a>
      <a href="#fasilitas">Fasilitas</a>
      <a href="#testimoni">Testimoni</a>
      <a href="#artikel">Artikel</a>
      <a href="#kontak">Kontak</a>
      <a href="https://instagram.com/metroautocool" target="_blank" rel="noopener">Instagram</a>
    </div>
    <a href="https://wa.me/628525858626 2?text=Halo%20Metro%20Autocool" target="_blank" rel="noopener" class="mc-mobile-contact">
      <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
      <span>Hubungi Kami</span>
    </a>
  </div>
</header>

<script>
  (function () {
    var btn = document.getElementById('mcMobileBtn');
    var panel = document.getElementById('mcMobilePanel');
    var overlay = document.getElementById('mcMobileOverlay');
    var closeBtn = document.getElementById('mcMobileClose');
    var panelLinks = panel ? panel.querySelectorAll('a') : [];

    if (!btn || !panel || !overlay || !closeBtn) return;

    function setMenuState(open) {
      panel.classList.toggle('open', open);
      overlay.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', String(open));
      document.body.style.overflow = open ? 'hidden' : '';
    }

    btn.addEventListener('click', function () {
      var isOpen = !panel.classList.contains('open');
      setMenuState(isOpen);
    });

    overlay.addEventListener('click', function () {
      setMenuState(false);
    });
    closeBtn.addEventListener('click', function () {
      setMenuState(false);
    });

    panelLinks.forEach(function (link) {
      link.addEventListener('click', function () {
        setMenuState(false);
      });
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') setMenuState(false);
    });
  })();
</script>
