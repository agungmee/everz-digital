<style>
  .mc-sticky-wa {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 1500;
    min-width: 56px;
    height: 56px;
    padding: 0 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #dc2626;
    border: 1px solid #ef4444;
    color: #ffffff;
    text-decoration: none;
    font-weight: 800;
    font-size: 18px;
    text-transform: uppercase;
    letter-spacing: .02em;
    border-radius: 0;
    animation: mcWaBounce 1.6s infinite;
    box-shadow: 0 10px 22px rgba(0, 0, 0, .35);
  }

  .mc-sticky-wa:hover {
    background: #b91c1c;
  }

  .mc-sticky-wa svg {
    width: 24px;
    height: 24px;
    fill: currentColor;
    display: block;
  }

  .mc-top-float {
    position: fixed;
    right: 16px;
    bottom: 100px;
    z-index: 1601;
    width: 56px;
    height: 56px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #111111;
    border: 1px solid #2a2a2a;
    color: #ffffff;
    border-radius: 0;
    box-shadow: 0 10px 22px rgba(0, 0, 0, .35);
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px);
    transition: opacity .22s ease, transform .22s ease, visibility .22s ease, background .2s ease;
  }

  .mc-top-float:hover {
    background: #242424;
  }

  .mc-top-float svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
    display: block;
  }

  .mc-top-float.mc-show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  @keyframes mcWaBounce {
    0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-10px); }
    60% { transform: translateY(-5px); }
  }

  @media (max-width: 900px) {
    .mc-sticky-wa {
      height: 52px;
      padding: 0 12px;
      right: 12px;
      bottom: 12px;
      font-size: 16px;
    }

    .mc-top-float {
      width: 52px;
      height: 52px;
      right: 12px;
      bottom: 92px;
    }
  }

  /* Hide sticky button when mobile menu is open */
  body.mc-mobile-open .mc-sticky-wa,
  body.mc-mobile-open .mc-top-float {
    display: none;
  }
</style>

<script>
  (function () {
    var toTopButton = document.querySelector('.mc-top-float');
    if (!toTopButton) return;

    function toggleToTopButton() {
      if (window.scrollY > 160) {
        toTopButton.classList.add('mc-show');
      } else {
        toTopButton.classList.remove('mc-show');
      }
    }

    toTopButton.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    toggleToTopButton();
    window.addEventListener('scroll', toggleToTopButton, { passive: true });
  })();
</script>
