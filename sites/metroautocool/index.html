  <script>
    (function () {
      function runScripts(scripts) {
        scripts.forEach(function (oldScript) {
          var newScript = document.createElement('script');

          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.textContent = oldScript.textContent;
          }

          oldScript.parentNode.replaceChild(newScript, oldScript);
        });
      }

      function includeSection(node) {
        var file = node.getAttribute('data-include');
        if (!file) return Promise.resolve();

        return fetch(file)
          .then(function (res) {
            if (!res.ok) throw new Error('Gagal memuat: ' + file);
            return res.text();
          })
          .then(function (html) {
            var wrapper = document.createElement('div');
            wrapper.innerHTML = html;
            var sectionScripts = Array.prototype.slice.call(wrapper.querySelectorAll('script'));

            var frag = document.createDocumentFragment();
            while (wrapper.firstChild) {
              frag.appendChild(wrapper.firstChild);
            }

            node.replaceWith(frag);
            runScripts(sectionScripts);
          })
          .catch(function () {
            node.innerHTML = '<p style="color:#b91c1c;padding:12px 0;">Section tidak bisa dimuat: ' + file + '</p>';
          });
      }

      var includeNodes = Array.prototype.slice.call(document.querySelectorAll('[data-include]'));
      Promise.all(includeNodes.map(includeSection));
    })();
  </script>
