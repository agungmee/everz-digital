  <style>
    :root{
      --ink:#0b1b2b;
      --paper:#f8faf9;
      --sun:#f6c453;
      --sea:#0b4d66;
      --glass:rgba(8,18,30,.52);
      --line:rgba(255,255,255,.22);
    }
    *{ box-sizing:border-box; }
    html, body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      overflow-x:hidden;
      background:#0b1220;
    }
    body{
      font-family:"Manrope", sans-serif;
      color:var(--paper);
    }
    .elementor,
    .elementor-section,
    .elementor-section-wrap,
    .elementor-container,
    .elementor-top-section,
    .elementor-column,
    .elementor-widget-wrap,
    .elementor-widget-container{
      margin:0 !important;
      padding:0 !important;
      max-width:100% !important;
      width:100% !important;
    }
    .elementor-section,
    .elementor-top-section,
    .elementor-section-wrap{
      margin-top:0 !important;
      padding-top:0 !important;
    }
    .elementor-section > .elementor-container{
      padding-left:0 !important;
      padding-right:0 !important;
      max-width:100% !important;
    }
    body > .elementor{
      margin-top:0 !important;
      padding-top:0 !important;
    }
    body > .elementor .elementor-section:first-child,
    body > .elementor .elementor-top-section:first-child{
      margin-top:0 !important;
      padding-top:0 !important;
    }
    body > .elementor .elementor-section:first-child > .elementor-container{
      margin-top:0 !important;
      padding-top:0 !important;
    }
    a{ color:inherit; text-decoration:none; }

    .aha-hero{
      position:relative;
      min-height:92vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      overflow:hidden;
      width:100vw;
      margin-left:calc(50% - 50vw);
      margin-top:0 !important;
      padding-top:0 !important;
    }

    .aha-slider{
      position:absolute;
      inset:0;
      z-index:0;
    }
    .aha-slide{
      position:absolute;
      inset:0;
      background-size:cover;
      background-position:center;
      opacity:0;
      transform:scale(1.02);
      transition:opacity 1.2s ease, transform 1.2s ease;
    }
    .aha-slide.active{
      opacity:1;
      transform:scale(1.01);
    }
    .aha-overlay{
      position:absolute;
      inset:0;
      background:
        linear-gradient(120deg, rgba(6,12,20,.92), rgba(6,12,20,.62) 45%, rgba(6,12,20,.25)),
        linear-gradient(0deg, rgba(6,12,20,.55), rgba(6,12,20,.15));
      z-index:1;
    }

    .aha-nav{
      position:fixed;
      top:0;
      left:0;
      right:0;
      z-index:5;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:18px 6vw;
      background:rgba(10,18,28,.02);
      box-shadow:none;
      transition:background .35s ease, box-shadow .35s ease, transform .35s ease;
    }
    .aha-nav .aha-menu a{ color:var(--paper); opacity:.85; }
    .aha-nav .aha-brand-text{ color:var(--paper); }
    .aha-nav .aha-btn{
      background:rgba(255,255,255,.06);
      color:var(--paper);
      border:1px solid var(--line);
    }
    .aha-nav .aha-btn.primary{
      background:var(--sun);
      color:#1b1b1b;
      border:0;
    }
    .aha-nav.is-scrolled{
      background:#ffffff !important;
      box-shadow:0 18px 40px rgba(15,23,42,.12) !important;
    }
    .aha-nav.is-scrolled .aha-menu a{ color:#0b1220; opacity:.8; }
    .aha-nav.is-scrolled .aha-brand-text{ color:#0b1220; }
    .aha-nav.is-scrolled .aha-btn{
      background:#f3f4f6;
      color:#0b1220;
      border:1px solid #e5e7eb;
    }
    .aha-nav.is-scrolled .aha-btn.primary{
      background:var(--sun);
      color:#1b1b1b;
      border:0;
    }
    .aha-brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:800;
      letter-spacing:.06em;
    }
    .aha-logo{
      width:44px;height:44px;
      border-radius:50% !important;
      border:2px solid rgba(255,255,255,.5);
      object-fit:cover;
      overflow:hidden;
      box-shadow:0 10px 26px rgba(0,0,0,.35);
    }
    .aha-menu{
      display:flex;
      gap:18px;
      font-size:14px;
      font-weight:600;
    }
    .aha-menu a{ opacity:.85; }
    .aha-menu a:hover{ opacity:1; }
    .aha-dropdown{
      position:relative;
      padding-bottom:6px;
    }
    .aha-dropdown > a{
      display:inline-flex;
      align-items:center;
      gap:6px;
    }
    .aha-caret{
      font-size:11px;
      opacity:.7;
    }
    .aha-dropdown-menu{
      position:absolute;
      top:calc(100% + 12px);
      left:0;
      min-width:200px;
      background:#ffffff;
      color:#0b1220;
      border:1px solid #e5e7eb;
      border-radius:14px;
      box-shadow:0 18px 40px rgba(15,23,42,.12);
      padding:8px;
      display:grid;
      gap:4px;
      opacity:0;
      pointer-events:none;
      transform:translateY(8px);
      transition:opacity .25s ease, transform .25s ease;
      z-index:999;
    }
    .aha-dropdown:hover .aha-dropdown-menu,
    .aha-dropdown-menu:hover{
      opacity:1;
      pointer-events:auto;
      transform:translateY(0);
    }
    .aha-dropdown-menu::before{
      content:"";
      position:absolute;
      top:-12px;
      left:0;
      right:0;
      height:12px;
    }
    .aha-dropdown-menu a{
      color:#0b1220 !important;
      padding:8px 10px;
      border-radius:10px;
      font-weight:600;
      opacity:1 !important;
    }
    .aha-dropdown-menu a:hover{
      background:#f3f4f6;
    }

    .aha-nav-actions{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .aha-cta{
      display:flex;gap:10px;align-items:center;
    }
    .aha-btn{
      padding:10px 16px;border-radius:999px;
      border:1px solid var(--line);
      backdrop-filter: blur(6px);
      background:rgba(255,255,255,.06);
      font-weight:700;font-size:13.5px;
    }
    .aha-btn.primary{
      background:var(--sun);
      color:#1b1b1b;
      border:0;
      box-shadow:0 14px 30px rgba(246,196,83,.35);
    }
    .aha-burger{
      display:grid;
      place-items:center;
      border:0;
      background:transparent;
      color:var(--paper);
      cursor:pointer;
      padding:8px;
    }
    .aha-burger:hover{
      transform:none;
      box-shadow:none;
    }
    .aha-burger-lines{
      position:relative;
      width:20px;
      height:14px;
    }
    .aha-burger-lines span{
      position:absolute;
      left:0;
      height:2px;
      background:currentColor;
      border-radius:999px;
      transition:transform .3s ease, opacity .2s ease, width .3s ease;
    }
    .aha-burger-lines span:nth-child(1){ top:0; width:20px; }
    .aha-burger-lines span:nth-child(2){ top:6px; width:14px; }
    .aha-burger-lines span:nth-child(3){ bottom:0; width:18px; }
    .aha-burger.is-open .aha-burger-lines span:nth-child(1){
      transform:translateY(6px) rotate(45deg);
      width:20px;
    }
    .aha-burger.is-open .aha-burger-lines span:nth-child(2){
      opacity:0;
      transform:translateX(-6px);
    }
    .aha-burger.is-open .aha-burger-lines span:nth-child(3){
      transform:translateY(-6px) rotate(-45deg);
      width:20px;
    }
    .aha-nav.is-scrolled .aha-burger{
      background:transparent;
      color:#0b1220;
      border:0;
    }

    .aha-content{
      position:relative;
      z-index:2;
      padding:calc(5vh + 56px) 6vw 10vh;
      display:grid;
      grid-template-columns:1.1fr .9fr;
      gap:36px;
      align-items:center;
      margin-top:0;
    }
    .aha-kicker{
      display:inline-flex;gap:10px;align-items:center;
      padding:8px 14px;border-radius:999px;
      background:var(--glass);
      border:1px solid var(--line);
      font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    }
    .aha-title{
      font-family:"Playfair Display", serif;
      font-size:48px;
      line-height:1.08;
      margin:16px 0 14px;
      text-shadow:0 12px 30px rgba(0,0,0,.45);
    }
    .aha-subtitle{
      font-size:15.5px;
      line-height:1.8;
      color:#e5e7eb;
      max-width:520px;
    }
    .aha-subtitle .aha-sub-short{ display:none; }
    .aha-actions{
      display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;
    }
    .aha-actions .aha-btn{ padding:12px 18px; }

    .aha-card{
      background:rgba(10,20,30,.72);
      border:1px solid rgba(255,255,255,.14);
      border-radius:20px;
      padding:20px;
      box-shadow:0 24px 60px rgba(0,0,0,.35);
    }
    .aha-card h3{
      margin:0 0 12px;font-size:16px;font-weight:800;letter-spacing:.02em;
    }
    .aha-card ul{
      margin:0;padding:0;list-style:none;display:grid;gap:10px;
      font-size:14px;color:#e5e7eb;
    }
    .aha-card li span{ color:#fef3c7; font-weight:700; }

    .aha-slide-indicator{
      position:absolute;
      right:6vw;
      bottom:6vh;
      z-index:2;
      display:flex;gap:8px;align-items:center;
    }
    .aha-dot{
      width:18px;height:4px;border-radius:999px;
      background:rgba(255,255,255,.35);
      transition:all .4s ease;
    }
    .aha-dot.active{ background:var(--sun); width:32px; }

    @media (max-width: 900px){
      .aha-hero{ min-height:100vh; }
      .aha-content{ grid-template-columns:1fr; align-items:flex-start; }
      .aha-title{ font-size:40px; }
      .aha-menu{ display:none; }
      .aha-burger{ display:grid; }
      .aha-content > div:first-child{
        text-align:center;
      }
      .aha-content > div:first-child .aha-kicker{
        margin:0 auto;
      }
      .aha-content > div:first-child .aha-subtitle{
        margin-left:auto;
        margin-right:auto;
      }
      .aha-actions{
        justify-content:center;
      }
    }
    @media (min-width: 901px){
      .aha-burger{ display:none; }
    }
    @media (max-width: 640px){
      .aha-hero{ min-height:96vh; }
      .aha-title{ font-size:30px; line-height:1.12; }
      .aha-subtitle{ font-size:14px; line-height:1.7; }
      .aha-subtitle .aha-sub-full{ display:none; }
      .aha-subtitle .aha-sub-short{ display:inline; }
      .aha-brand-text{
        display:block;
      }
      .aha-card{ padding:16px; }
      .aha-nav{ padding:16px 5vw; }
      .aha-content{ padding:calc(3vh + 52px) 5vw 8vh; gap:22px; }
      .aha-cta .aha-btn{ padding:9px 12px; font-size:12.5px; }
      .aha-actions{ margin-top:16px; }
      .aha-actions .aha-btn{ padding:11px 14px; }
      .aha-slide-indicator{ right:5vw; bottom:4vh; }
    }

    .aha-section{
      padding:70px 6vw;
      background:#fff;
      color:#0b1220;
      width:100vw;
      margin-left:calc(50% - 50vw);
    }
    .aha-section-title{
      font-family:"Playfair Display", serif;
      text-align:center;
      font-size:34px;
      margin:0 0 12px;
      color:#0b1220;
    }
    .aha-section-sub{
      text-align:center;
      max-width:720px;
      margin:0 auto 34px;
      color:#4b5563;
      font-size:15px;
      line-height:1.75;
    }
    .aha-activity{
      background:
        radial-gradient(circle at 12% 0%, rgba(246,196,83,.22), transparent 45%),
        radial-gradient(circle at 85% 10%, rgba(11,77,102,.12), transparent 38%),
        #fff;
    }
    .aha-activity-wrap{
      position:relative;
    }
    .aha-activity-track{
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:18px;
    }
    .aha-activity-card{
      background:#ffffff;
      border:1px solid rgba(11,77,102,.12);
      border-radius:22px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      box-shadow:0 18px 40px rgba(15,23,42,.08);
      transition:transform .35s ease, box-shadow .35s ease;
    }
    .aha-activity-card:hover{
      transform:translateY(-6px);
      box-shadow:0 26px 50px rgba(15,23,42,.12);
    }
    .aha-activity-media{
      position:relative;
      height:190px;
      background:#0b1220;
    }
    .aha-activity-media img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .aha-activity-price{
      position:absolute;
      left:14px;
      bottom:14px;
      background:rgba(11,27,43,.9);
      color:#fff;
      padding:10px 12px;
      border-radius:14px;
      font-size:12.5px;
      font-weight:800;
      letter-spacing:.02em;
      box-shadow:0 10px 24px rgba(0,0,0,.25);
    }
    .aha-activity-price span{
      display:block;
      font-size:11px;
      font-weight:600;
      opacity:.8;
      letter-spacing:.03em;
    }
    .aha-activity-body{
      padding:18px;
      display:flex;
      flex-direction:column;
      gap:12px;
      flex:1;
    }
    .aha-activity-body h3{
      margin:0;
      font-size:17px;
      font-weight:800;
      color:#111827;
    }
    .aha-activity-tag{
      margin:0;
      font-size:13px;
      font-weight:700;
      color:#0b4d66;
      text-transform:uppercase;
      letter-spacing:.08em;
    }
    .aha-activity-list{
      margin:0;
      padding-left:18px;
      color:#4b5563;
      font-size:13.5px;
      line-height:1.6;
      display:grid;
      gap:6px;
    }
    .aha-activity-more{
      border-top:1px dashed #e5e7eb;
      padding-top:10px;
      max-height:0;
      opacity:0;
      overflow:hidden;
      transition:max-height .4s ease, opacity .35s ease;
    }
    .aha-activity-card.is-open .aha-activity-more{
      max-height:220px;
      opacity:1;
    }
    .aha-activity-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:auto;
    }
    .aha-activity-actions .aha-btn{
      font-size:13px;
      padding:10px 14px;
    }
    .aha-bonus{
      color:#b45309;
      font-weight:700;
    }
    .aha-activity-dots{
      display:none;
      justify-content:center;
      gap:8px;
      margin-top:18px;
    }
    .aha-activity-dot{
      width:8px;
      height:8px;
      border-radius:999px;
      background:#d1d5db;
      transition:all .3s ease;
    }
    .aha-activity-dot.active{
      width:24px;
      background:var(--sun);
    }

    .aha-mobile{
      position:fixed;
      inset:0;
      z-index:200;
      opacity:0;
      pointer-events:none;
      transition:opacity .3s ease;
    }
    .aha-mobile.is-open{
      opacity:1;
      pointer-events:auto;
    }
    .aha-mobile-backdrop{
      position:absolute;
      inset:0;
      background:rgba(2,6,23,.6);
      backdrop-filter: blur(4px);
    }
    .aha-mobile-panel{
      position:absolute;
      top:0;
      right:0;
      height:100%;
      width:min(340px, 86vw);
      background:linear-gradient(160deg, #0b1220 0%, #0f1a2b 55%, #0b2230 100%);
      color:#f8faf9;
      padding:20px;
      display:flex;
      flex-direction:column;
      gap:18px;
      box-shadow:-18px 0 50px rgba(3,10,20,.35);
      transform:translateX(12px);
      transition:transform .3s ease;
    }
    .aha-mobile.is-open .aha-mobile-panel{
      transform:translateX(0);
    }
    .aha-mobile-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .aha-mobile-title{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.14em;
      font-weight:800;
      opacity:.7;
    }
    .aha-mobile-close{
      width:36px;
      height:36px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.2);
      background:rgba(255,255,255,.08);
      color:#f8faf9;
      cursor:pointer;
      font-size:16px;
    }
    .aha-mobile-links{
      display:grid;
      gap:10px;
    }
    .aha-mobile-links a,
    .aha-mobile-toggle{
      color:#f8faf9;
      font-weight:700;
      padding:10px 12px;
      border-radius:12px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      text-align:left;
      font-family:inherit;
    }
    .aha-mobile-toggle{
      display:flex;
      align-items:center;
      justify-content:space-between;
      cursor:pointer;
    }
    .aha-mobile-sub{
      display:grid;
      gap:8px;
      padding-left:10px;
      max-height:0;
      overflow:hidden;
      transition:max-height .3s ease;
    }
    .aha-mobile-sub.is-open{
      max-height:400px;
    }
    .aha-mobile-sub a{
      font-weight:600;
      background:rgba(255,255,255,.03);
    }

    .aha-contact{
      background:linear-gradient(120deg, #ffffff 0%, #f9fafb 55%, #f1f5f9 100%);
    }
    .aha-contact-grid{
      display:grid;
      grid-template-columns:1fr 1.1fr;
      gap:24px;
      align-items:stretch;
    }
    .aha-contact-card{
      background:#ffffff;
      border:1px solid #e5e7eb;
      border-radius:20px;
      padding:22px;
      box-shadow:0 18px 40px rgba(15,23,42,.08);
    }
    .aha-contact-card h3{
      margin:0 0 10px;
      font-size:20px;
      font-weight:800;
      color:#111827;
    }
    .aha-contact-card p{
      margin:0 0 16px;
      color:#4b5563;
      font-size:14.5px;
      line-height:1.7;
    }
    .aha-contact-list{
      list-style:none;
      margin:0;
      padding:0;
      display:grid;
      gap:10px;
      font-size:14px;
      color:#111827;
    }
    .aha-contact-list li{
      display:grid;
      grid-template-columns:112px 1fr;
      column-gap:12px;
      align-items:start;
    }
    .aha-contact-list span{
      position:relative;
      color:#6b7280;
      font-weight:600;
      padding-right:14px;
      white-space:nowrap;
    }
    .aha-contact-list span::after{
      content:":";
      position:absolute;
      right:0;
      top:0;
    }
    .aha-contact-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:16px;
    }
    .aha-map{
      border:1px solid #e5e7eb;
      border-radius:20px;
      overflow:hidden;
      background:#fff;
      box-shadow:0 18px 40px rgba(15,23,42,.08);
      min-height:320px;
    }
    .aha-map iframe{
      width:100%;
      height:100%;
      border:0;
      display:block;
    }

    .aha-testimonial{
      background:linear-gradient(135deg, #0b1220 0%, #101b2c 60%, #0c1f2d 100%);
      color:var(--paper);
    }
    .aha-testimonial .aha-section-title{ color:#f8faf9; }
