<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-label="Ilustrasi dekorasi pelaminan outdoor tanpa orang">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8f2"/>
      <stop offset="100%" stop-color="#ffe8d4"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6ead3"/>
      <stop offset="100%" stop-color="#e5d0ad"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#sky)"/>
  <ellipse cx="800" cy="980" rx="670" ry="170" fill="url(#ground)"/>

  <rect x="390" y="740" width="820" height="170" rx="28" fill="#ffffff" opacity="0.88"/>
  <rect x="430" y="765" width="740" height="120" rx="18" fill="#fffaf1"/>

  <path d="M520 760 C 520 545, 1080 545, 1080 760" fill="none" stroke="#cda872" stroke-width="22" stroke-linecap="round"/>
  <path d="M560 760 C 560 590, 1040 590, 1040 760" fill="none" stroke="#f9e7c8" stroke-width="14" stroke-linecap="round"/>

  <g filter="url(#soft)">
    <circle cx="560" cy="745" r="40" fill="#f7d8d8"/>
    <circle cx="1040" cy="745" r="40" fill="#f7d8d8"/>
    <circle cx="620" cy="702" r="28" fill="#ffe9c8"/>
    <circle cx="980" cy="702" r="28" fill="#ffe9c8"/>
    <circle cx="800" cy="660" r="45" fill="#fff0d6"/>
  </g>

  <rect x="470" y="825" width="660" height="26" rx="13" fill="#dcb57a" opacity="0.85"/>
  <rect x="520" y="865" width="560" height="18" rx="9" fill="#e6c995" opacity="0.9"/>

  <circle cx="430" cy="770" r="12" fill="#ffffff" opacity="0.8"/>
  <circle cx="1170" cy="770" r="12" fill="#ffffff" opacity="0.8"/>
  <circle cx="490" cy="700" r="10" fill="#ffffff" opacity="0.75"/>
  <circle cx="1110" cy="700" r="10" fill="#ffffff" opacity="0.75"/>
</svg>