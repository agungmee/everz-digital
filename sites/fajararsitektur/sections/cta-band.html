<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fajar Arsitektur - CTA Band</title>
  <style>
    body{margin:0;font-family:system-ui,sans-serif;background:#f3f6fb}
    .container{width:min(92vw,1150px);margin:0 auto}
    .cta-band{background:linear-gradient(120deg,rgba(15,23,42,.82),rgba(21,64,122,.88)),url("https://images.unsplash.com/photo-1503387762-592deb58ef4e?q=80&w=1400&auto=format&fit=crop") center/cover;color:#fff;padding:34px 0}
    .cta-band-inner{display:flex;align-items:center;justify-content:space-between;gap:20px}
    .cta-band h3{margin:0;font-size:22px;font-weight:600;letter-spacing:.01em}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid #2f6ce0;background:transparent;color:#fff;text-decoration:none}
    @media(max-width:640px){.cta-band-inner{flex-direction:column;align-items:flex-start}.cta-band h3{font-size:16px}}
  </style>
</head>
<body>
  <section class="cta-band">
    <div class="container cta-band-inner">
      <h3>Jasa arsitek & konstruksi terpercaya, kami tak sekadar membangun, kami merancang ruang yang nyaman, rapi, dan tahan lama.</h3>
      <a class="btn" href="#">Hubungi Kami</a>
    </div>
  </section>
  <script></script>
</body>
</html>
