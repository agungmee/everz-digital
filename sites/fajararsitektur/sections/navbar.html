<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fajar Arsitektur - Navbar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    :root{--ink:#0f172a;--ink-soft:#64748b;--blue:#2f6ce0;--blue-strong:#1f57c7;--stroke:#e3eaf5;--wrap:1150px}
    *{box-sizing:border-box}
    body{margin:0;font-family:"Poppins",system-ui,sans-serif;color:var(--ink);background:#f3f6fb}
    a{text-decoration:none;color:inherit}
    .container{width:min(92vw,var(--wrap));margin:0 auto}
    .brand-logo{
      width:38px !important;
      height:38px !important;
      min-width:38px !important;
      max-width:38px !important;
      object-fit:contain;
      display:block;
      flex-shrink:0;
    }

    .topbar{background:#fff;border-bottom:1px solid var(--stroke);font-size:12px;color:var(--ink-soft)}
    .topbar-inner{display:flex;justify-content:space-between;gap:24px;padding:10px 0}
    .topbar-info{display:flex;gap:12px}
    .topbar-actions{display:flex;align-items:center;gap:10px}
    .topbar-actions a{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;border:1px solid var(--stroke);color:var(--blue-strong);background:#fff;font-size:13px}

    .navbar{background:#fff;position:sticky;top:0;z-index:999;border-bottom:1px solid var(--stroke)}
    .nav-inner{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 0}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em;max-width:max-content}
    .brand-text{display:flex;flex-direction:column;line-height:1.1}
    .brand-text strong{font-size:14px;letter-spacing:.04em}
    .brand-text span{font-size:12px;font-weight:500;color:var(--ink-soft)}
    .nav-links{display:flex;align-items:center;gap:22px;color:var(--ink-soft);font-weight:500;font-size:14px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid transparent;background:var(--blue);color:#fff;box-shadow:0 12px 28px rgba(47,108,224,.28)}
    .menu-btn{display:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--stroke);background:#fff;color:var(--blue-strong);font-size:18px;align-items:center;justify-content:center;cursor:pointer}

    .mobile-menu{position:fixed;inset:0;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:1200}
    .mobile-menu.open{opacity:1;pointer-events:auto}
    .mobile-menu-panel{position:absolute;top:0;right:0;height:100%;width:min(78vw,320px);background:#fff;box-shadow:-20px 0 50px rgba(15,23,42,.2);transform:translateX(100%);transition:transform .45s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column;padding:24px 20px;gap:18px}
    .mobile-menu.open .mobile-menu-panel{transform:translateX(0)}
    .mobile-menu-panel a{font-weight:600;color:var(--ink);padding:8px 0;border-bottom:1px solid var(--stroke)}
    .mobile-menu-close{align-self:flex-end;width:36px;height:36px;border-radius:10px;border:1px solid var(--stroke);background:#fff;color:var(--ink);font-size:16px;display:grid;place-items:center;cursor:pointer}
    .mobile-menu-cta{margin-top:auto;display:flex;justify-content:center;padding-top:16px}
    .mobile-menu-cta .btn{width:100%;justify-content:center;gap:10px;display:inline-flex}

    @media (max-width:980px){
      .nav-links{display:none}
      .nav-inner > .btn{display:none}
      .menu-btn{display:inline-flex}
    }
    @media (max-width:640px){
      .topbar-inner{flex-direction:column;align-items:flex-start}
      .topbar-info{display:none}
      .topbar-actions{justify-content:center;width:100%}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="container topbar-inner">
      <div class="topbar-info">Jl. Thamrin 78, depan SMA 5 Kupang • 08.00 - 18.00</div>
      <div class="topbar-actions">
        <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" aria-label="TikTok"><i class="fa-brands fa-tiktok"></i></a>
        <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="tel:+6281338789995" aria-label="Call"><i class="fa-solid fa-phone"></i></a>
        <a href="https://wa.me/6281338789995" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
      </div>
    </div>
  </div>

  <header class="navbar">
    <div class="container nav-inner">
      <div class="brand">
        <img class="brand-logo" src="https://everz-digital.site/wp-content/uploads/2026/02/876f2b4f-f719-462b-ad3e-fbead13eee09-removebg-preview.png" alt="Fajar Arsitektur logo">
        <div class="brand-text">
          <strong>CV Fajar Gemilang Plus</strong>
          <span>fajararsitektur.com</span>
        </div>
      </div>
      <nav class="nav-links">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#projects">Projects</a>
        <a href="#blog">Blog</a>
        <a href="#contact">Contact</a>
      </nav>
      <a class="btn" href="#contact">Request Quote</a>
      <button class="menu-btn" id="menu-open" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
    </div>
  </header>

  <div class="mobile-menu" id="mobile-menu" aria-hidden="true">
    <div class="mobile-menu-panel" role="dialog" aria-modal="true" aria-label="Mobile navigation">
      <button class="mobile-menu-close" id="menu-close" aria-label="Close menu"><i class="fa-solid fa-xmark"></i></button>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <a href="#projects">Projects</a>
      <a href="#blog">Blog</a>
      <a href="#contact">Contact</a>
      <div class="mobile-menu-cta">
        <a class="btn" href="https://wa.me/6281338789995"><i class="fa-brands fa-whatsapp"></i> Konsultasi Gratis</a>
      </div>
    </div>
  </div>

  <script>
    const menu = document.getElementById('mobile-menu');
    const openBtn = document.getElementById('menu-open');
    const closeBtn = document.getElementById('menu-close');
    const menuLinks = menu ? menu.querySelectorAll('a') : [];

    function openMenu() {
      if (!menu) return;
      menu.classList.add('open');
      menu.setAttribute('aria-hidden', 'false');
    }

    function closeMenu() {
      if (!menu) return;
      menu.classList.remove('open');
      menu.setAttribute('aria-hidden', 'true');
    }

    if (openBtn) openBtn.addEventListener('click', openMenu);
    if (closeBtn) closeBtn.addEventListener('click', closeMenu);
    if (menu) {
      menu.addEventListener('click', function(event) {
        if (event.target === menu) closeMenu();
      });
    }
    menuLinks.forEach((link) => link.addEventListener('click', closeMenu));
  </script>
</body>
</html>
