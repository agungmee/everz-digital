<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fajar Arsitektur - About</title>
  <style>
    :root{--stroke:#e3eaf5;--blue:#2f6ce0;--ink:#0f172a;--ink-soft:#64748b}
    body{margin:0;font-family:system-ui,sans-serif;background:#f3f6fb;color:var(--ink)}
    .container{width:min(92vw,1150px);margin:0 auto;padding:60px 0}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center}
    .split-card{background:#fff;border-radius:18px;padding:24px;border:1px solid var(--stroke);box-shadow:0 16px 40px rgba(15,23,42,.12)}
    .tag{display:inline-block;background:#e9f1ff;color:#1f57c7;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:600}
    h2{margin:12px 0 10px;font-size:32px}
    p{margin:0;color:var(--ink-soft);line-height:1.7}
    .btn{margin-top:16px;display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;background:var(--blue);color:#fff;text-decoration:none}
    @media(max-width:980px){.split{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <section id="about">
    <div class="container split">
      <div class="split-card">
        <div class="tag">About Us</div>
        <h2>Arsitek dan konstruksi yang fokus pada hasil rapi dan fungsional.</h2>
        <p>CV Fajar Gemilang Plus menghadirkan layanan arsitek dan konstruksi untuk hunian maupun komersial. Mulai dari perencanaan hingga pelaksanaan, kami memastikan proyek berjalan terukur dan tepat waktu.</p>
        <a class="btn" href="#">Selengkapnya</a>
      </div>
      <div class="split-card" style="padding:0;overflow:hidden;min-height:320px;background:url('https://everz-digital.site/wp-content/uploads/2026/02/architecture-drawing-og-making-the-house.jpg') center/cover;"></div>
    </div>
  </section>
  <script></script>
</body>
</html>
